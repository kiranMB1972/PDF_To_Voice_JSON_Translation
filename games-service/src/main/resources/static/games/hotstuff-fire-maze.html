<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><title>Hotstuff Fire Maze</title><style>html,body{margin:0;height:100%;background:#0b3a68;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:Georgia,serif}canvas{display:block}#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,50,95,.82);color:#ffd700;text-align:center;padding:20px;cursor:pointer}#ovTitle{font-size:clamp(24px,5vw,40px);font-weight:bold;text-shadow:2px 2px 0 #8a6508,4px 4px 8px #0a2f55}#ovText{margin-top:12px;color:#e6f2ff;max-width:560px;line-height:1.5}.tc{position:fixed;bottom:14px;display:flex;gap:10px;z-index:5}.tc.l{left:14px}.tc.r{right:14px}.tb{width:74px;height:74px;border-radius:50%;border:3px solid #ffd700;background:rgba(12,62,112,.7);color:#ffd700;font:bold 15px Georgia,serif;display:flex;align-items:center;justify-content:center}@media (hover:hover) and (pointer:fine){.tc{display:none}}</style></head><body>
<canvas id="c"></canvas><div id="overlay"><div id="ovTitle"></div><div id="ovText"></div></div>
<div class="tc l"><div class="tb" data-act="left">&#9664;</div><div class="tb" data-act="right">&#9654;</div></div><div class="tc r"><div class="tb" data-act="up">&#9650;</div><div class="tb" data-act="down">&#9660;</div></div>
<script src="common.js"></script>
<script>
(function () {
  'use strict';
  var W, H, grid, px, py, gx, gy, cx, cy, hasCrown, level, timeLeft, cd, bonus;

  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  /* perfect maze (depth-first): every cell reachable, so the diamond can always be reached */
  function build(c, r) {
    W = 2 * c + 1; H = 2 * r + 1; grid = [];
    for (var y = 0; y < H; y++) grid.push(new Array(W).fill(1));
    var stack = [[1, 1]]; grid[1][1] = 0;
    while (stack.length) {
      var cur = stack[stack.length - 1], moved = false, dirs = shuffle([[2, 0], [-2, 0], [0, 2], [0, -2]]);
      for (var i = 0; i < 4; i++) {
        var nx = cur[0] + dirs[i][0], ny = cur[1] + dirs[i][1];
        if (nx > 0 && ny > 0 && nx < W - 1 && ny < H - 1 && grid[ny][nx] === 1) {
          grid[cur[1] + dirs[i][1] / 2][cur[0] + dirs[i][0] / 2] = 0; grid[ny][nx] = 0; stack.push([nx, ny]); moved = true; break;
        }
      }
      if (!moved) stack.pop();
    }
    px = 1; py = 1; gx = W - 2; gy = H - 2;
    do { cx = 1 + 2 * Math.floor(Math.random() * c); cy = 1 + 2 * Math.floor(Math.random() * r); } while ((cx === 1 && cy === 1) || (cx === gx && cy === gy));
    hasCrown = true;
    timeLeft = 25 + c * r * 1.6;
  }
  function newLevel() { var n = Math.min(4 + level, 12); build(n, Math.max(3, n - 1)); }
  function reset() { level = 1; bonus = 0; cd = 0; newLevel(); }

  function tryMove(dx, dy) {
    var nx = px + dx, ny = py + dy;
    if (ny < 0 || nx < 0 || ny >= H || nx >= W || grid[ny][nx] === 1) return;
    px = nx; py = ny;
    if (hasCrown && px === cx && py === cy) { hasCrown = false; timeLeft += 10; bonus += 50; }
    if (px === gx && py === gy) { bonus += 100 + Math.floor(timeLeft) * 2; level++; newLevel(); }
  }

  function update(dt) {
    var k = GK.keys; cd -= dt;
    timeLeft -= dt; if (timeLeft <= 0) { timeLeft = 0; GK.gameOver('Time is up!'); return; }
    if (GK.pressed('left')) { tryMove(-1, 0); cd = 0.16; } else if (GK.pressed('right')) { tryMove(1, 0); cd = 0.16; }
    else if (GK.pressed('up')) { tryMove(0, -1); cd = 0.16; } else if (GK.pressed('down')) { tryMove(0, 1); cd = 0.16; }
    else if (cd <= 0) {                                                  // held key keeps walking
      if (k.left) tryMove(-1, 0); else if (k.right) tryMove(1, 0); else if (k.up) tryMove(0, -1); else if (k.down) tryMove(0, 1);
      cd = 0.11;
    }
    GK.score = bonus + (level - 1) * 100;
  }

  function draw(ctx, w, h) {
    var g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#0f4c85'); g.addColorStop(1, '#2d7cc4');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    var cell = Math.floor(Math.min((w - 30) / W, (h - 110) / H)), ox = Math.floor((w - cell * W) / 2), oy = 48;
    var bob = Math.sin(GK.time * 6) * 2;
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var X = ox + x * cell, Y = oy + y * cell;
      if (grid[y][x] === 1) { GK.rr(ctx, X + 1, Y + 1, cell - 2, cell - 2, 4); ctx.fillStyle = '#134f8c'; ctx.fill(); ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 1; ctx.stroke(); }
      else { ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(X, Y, cell, cell); }
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = Math.floor(cell * 0.8) + 'px ' + GK.EMOJI;
    ctx.fillText('\uD83D\uDC8E', ox + gx * cell + cell / 2, oy + gy * cell + cell / 2);
    if (hasCrown) ctx.fillText('\uD83D\uDC51', ox + cx * cell + cell / 2, oy + cy * cell + cell / 2 + bob);
    ctx.fillText('\uD83D\uDD25', ox + px * cell + cell / 2, oy + py * cell + cell / 2 + bob);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }

  GK.start({ id: 'hotstuff-fire-maze', title: 'Hotstuff Fire Maze', tip: 'Guide Hotstuff to the diamond. Arrows / WASD or the touch pad. Grab the crown for +10 seconds!',
             reset: reset, update: update, draw: draw, hud: function () { return 'Level ' + level + '  Time ' + Math.ceil(timeLeft); } });
  GK.test = {
    state: function () { return { level: level, px: px, py: py, gx: gx, gy: gy, timeLeft: timeLeft, crown: hasCrown }; },
    solve: function () {                                                 // BFS path from the player to the diamond: list of [dx,dy]
      var prev = {}, q = [[px, py]], key = function (x, y) { return x + ',' + y; }; prev[key(px, py)] = null;
      while (q.length) { var c = q.shift(); if (c[0] === gx && c[1] === gy) break;
        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) { var nx = c[0] + d[0], ny = c[1] + d[1];
          if (grid[ny] && grid[ny][nx] === 0 && !(key(nx, ny) in prev)) { prev[key(nx, ny)] = [c[0], c[1], d]; q.push([nx, ny]); } }); }
      var path = [], cur = prev[key(gx, gy)], x = gx, y = gy;
      while (cur) { path.unshift(cur[2]); x = cur[0]; y = cur[1]; cur = prev[key(x, y)]; }
      return path;
    }
  };
})();
</script>
</body></html>
